<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JevP · 企业-产品匹配调试台</title>
<style>
  :root {
    --bg:#0f1420; --panel:#171e2e; --panel2:#1d2740; --line:#2a3550;
    --text:#e5e9f2; --muted:#8b95ab; --hl:#5b8cff; --hl2:#7aa2ff;
    --gold:#f5c26b; --green:#37d28b; --amber:#f5a623; --red:#ff6b6b;
    --mono:"JetBrains Mono",Consolas,"Cascadia Code",monospace;
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
         background:radial-gradient(1200px 600px at 20% -10%, #1a2barder 0%, transparent 60%),
                    linear-gradient(160deg,#0f1420,#0b101a 55%,#0d1220);
         background-color:var(--bg); color:var(--text); min-height:100vh; }
  header { padding:20px 28px 14px; display:flex; align-items:baseline; gap:14px; flex-wrap:wrap;
           border-bottom:1px solid var(--line); background:rgba(13,19,32,.6); backdrop-filter:blur(6px);
           position:sticky; top:0; z-index:5; }
  header .logo { width:26px; height:26px; border-radius:8px; background:linear-gradient(135deg,var(--hl),#3b5bdb);
                 display:inline-flex; align-items:center; justify-content:center; font-weight:800; color:#fff; font-size:14px;
                 box-shadow:0 0 18px rgba(91,140,255,.5); vertical-align:-6px; margin-right:6px; }
  header b { font-size:17px; letter-spacing:.2px; }
  header .sub { color:var(--muted); font-size:12px; }
  header .right { margin-left:auto; font-size:11px; color:var(--muted);
                  background:var(--panel); border:1px solid var(--line); padding:4px 10px; border-radius:20px; }
  main { max-width:1280px; margin:20px auto 40px; padding:0 20px; display:grid;
         grid-template-columns:390px 1fr; gap:18px; align-items:start; }
  @media (max-width:960px){ main{ grid-template-columns:1fr; } }
  .card { background:linear-gradient(180deg,var(--panel),var(--bg)); border:1px solid var(--line);
          border-radius:14px; padding:16px 18px; box-shadow:0 6px 24px rgba(0,0,0,.25); }
  .card h3 { margin:0 0 12px; font-size:13px; color:#c3cdf2; font-weight:600;
             display:flex; align-items:center; gap:8px; }
  .card h3 .tag { font-size:10px; color:var(--muted); border:1px solid var(--line);
                  border-radius:10px; padding:1px 8px; font-weight:400; }
  label { display:block; font-size:11px; color:var(--muted); margin:12px 0 5px; letter-spacing:.3px; }
  textarea { width:100%; min-height:150px; background:#0b1019; color:#cfe3ff; border:1px solid var(--line);
             border-radius:10px; padding:10px; font:12px/1.5 var(--mono); resize:vertical; outline:none; }
  textarea:focus { border-color:var(--hl); box-shadow:0 0 0 3px rgba(91,140,255,.15); }
  textarea#product { min-height:56px; }
  .btnline { display:flex; gap:8px; margin:10px 0 2px; flex-wrap:wrap; }
  button { font:inherit; border:1px solid var(--line); background:var(--panel2); color:var(--text);
           padding:7px 13px; border-radius:9px; cursor:pointer; transition:.15s; }
  button:hover { border-color:var(--hl); color:#fff; }
  button.small { padding:3px 9px; font-size:11px; border-radius:7px; }
  button.primary { background:linear-gradient(135deg,var(--hl),#3b5bdb); border:none; color:#fff;
                   font-weight:600; box-shadow:0 4px 14px rgba(59,91,219,.4); }
  button.primary:hover { filter:brightness(1.08); }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .controls { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:8px 10px;
              display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  select { background:var(--panel2); color:var(--text); border:1px solid var(--line); border-radius:8px;
           padding:5px 8px; font-size:12px; }
  .chk { display:inline-flex; align-items:center; gap:5px; font-size:12px; color:var(--muted); cursor:pointer; }
  .errmsg { display:none; margin-top:10px; color:#ffb4b4; background:rgba(255,107,107,.1);
            border:1px solid rgba(255,107,107,.35); padding:9px 12px; border-radius:9px; font-size:12px; }
  table { width:100%; border-collapse:collapse; font-size:12.5px; }
  th { text-align:left; padding:8px 9px; color:var(--muted); font-weight:600; font-size:11px;
       letter-spacing:.4px; border-bottom:1px solid var(--line); white-space:nowrap; }
  td { padding:9px; border-bottom:1px solid rgba(42,53,80,.5); vertical-align:middle; }
  tr:hover td { background:rgba(91,140,255,.05); }
  .medal { display:inline-flex; width:22px; height:22px; border-radius:50%; align-items:center;
           justify-content:center; font-size:11px; font-weight:700; }
  .m1 { background:linear-gradient(135deg,#f5c26b,#caa13d); color:#3a2c00; }
  .m2 { background:linear-gradient(135deg,#cdd6e4,#97a3b6); color:#222d3d; }
  .m3 { background:linear-gradient(135deg,#d8a06b,#a06a35); color:#3d250a; }
  .mn { background:var(--panel2); color:var(--muted); }
  .scorecell { font-weight:700; font-variant-numeric:tabular-nums; }
  .sc-high { color:var(--green); } .sc-mid { color:var(--amber); } .sc-low { color:var(--red); }
  .badge { display:inline-block; border-radius:6px; padding:2px 8px; font-size:11px; font-weight:600; }
  .b-zh { background:rgba(91,140,255,.16); color:#9db9ff; }
  .b-en { background:rgba(55,210,139,.14); color:#6fe0ab; }
  .adv-fire { background:rgba(255,107,107,.16); color:#ff9d9d; }
  .adv-ok { background:rgba(55,210,139,.14); color:#6fe0ab; }
  .adv-wait { background:rgba(245,166,35,.14); color:#ffc877; }
  .adv-none { background:rgba(139,149,171,.14); color:#a8b2c8; }
  .patched { color:var(--amber); font-size:11px; margin-left:4px; }
  details { border:1px solid var(--line); border-radius:9px; margin:4px 0 10px; padding:4px 10px;
            background:rgba(11,16,25,.5); }
  summary { cursor:pointer; font-size:11.5px; color:var(--muted); }
  pre { background:#0a0f18; color:#cfe0ff; border:1px solid var(--line); border-radius:10px; padding:12px;
        font:11.5px/1.5 var(--mono); max-height:360px; overflow:auto; white-space:pre-wrap; word-break:break-all; }
  .jstr{color:#9ece6a} .jnum{color:#7aa2ff} .jkey{color:#f5c26b} .jboo{color:#ff7b72} .jnull{color:#8b95ab}
  .note { font-size:10.5px; color:var(--muted); margin-top:8px; line-height:1.6; }
  .spinner { display:inline-block; width:14px; height:14px; border:2px solid rgba(255,255,255,.25);
             border-top-color:#fff; border-radius:50%; animation:sp .7s linear infinite; vertical-align:-2px; margin-right:8px; }
  @keyframes sp { to { transform:rotate(360deg); } }
  .meta-line { color:var(--muted); font-size:11px; margin-top:8px; display:flex; gap:14px; flex-wrap:wrap; }
  .meta-line b { color:#c3cdf2; font-weight:600; }
  .section-gap { margin-top:14px; }
</style>
</head>
<body>
<header>
  <span class="logo">J</span><b>JevP · 企业-产品匹配调试台</b>
  <span class="sub">潜在客户挖掘 · 打分排序 · 双语支持</span>
  <span class="right">schema · enterprise-match.v2</span>
</header>

<main>
  <div>
    <div class="card">
      <h3>① 输入 <span class="tag">product + companies</span></h3>
      <label>产品信息（可选，缺省内置 Titan-PHM 预测性维护平台）</label>
      <textarea id="product" spellcheck="false" placeholder='{"name":"...","description":"..."}'></textarea>
      <label>企业档案 JSON 数组（默认预填完整模板，改值即可；可点"添加模板企业"拼多家）</label>
      <textarea id="companies" spellcheck="false"></textarea>
      <div class="btnline">
        <button class="small" onclick="loadExample('zh')">◈ 加载中文示例(8家)</button>
        <button class="small" onclick="loadExample('en')">◈ 加载英文示例(6家)</button>
        <button class="small" onclick="addTemplateCompany()">＋ 添加模板企业</button>
        <button class="small" onclick="resetToTemplate()">↺ 恢复默认模板</button>
      </div>
      <label>参数</label>
      <div class="controls">
        <select id="questions">
          <option value="core" selected>core · 3问/家</option>
          <option value="all">all · 6问/家</option>
          <option value="min">min · 1问/家（开启校正时2问）</option>
        </select>
        <select id="backend">
          <option value="auto" selected>auto · 27B(质量优先)</option>
          <option value="router">router · 语言路由</option>
          <option value="openai">openai · 27B直连</option>
          <option value="laya">laya · 判别式</option>
          <option value="agentjev">agentjev · GPU</option>
        </select>
        <select id="mode">
          <option value="full" selected>全量评分</option>
          <option value="topk">筛选500家，返回前100家</option>
        </select>
        <label class="chk"><input type="checkbox" id="patch" checked> 域先验校正</label>
      </div>
      <div class="btnline">
        <button class="primary" id="runBtn" onclick="runMatch()">▶ 开始匹配</button>
      </div>
      <div class="errmsg" id="err"></div>
    </div>
  </div>

  <div id="out"></div>
</main>

<script>
const BASE = '';
const $ = id => document.getElementById(id);

// 内置兜底模板（服务端 /api/match/template 优先，取到后替换；离线场景用此）
const BOOT_TEMPLATE = {
  company: {
    name: "示例企业（改这里）",
    basic: { industry: "机械制造", scale: "中型", location: "苏州", employees: "500", since: 2010 },
    bidding: [{ year: 2026, title: "设备预测性维护系统招标", amount: 80 }],
    website: { strategy: "智能制造与设备全生命周期管理", news: "新产线投产" },
    supply_chain: { customers: "汽车零部件制造商", suppliers: "数控机床厂商", leverage: "设备密集，可作渠道切入" }
  },
  product: {
    name: "Titan-PHM 工业装备预测性维护平台",
    description: "面向制造业的设备健康管理 SaaS：AI 故障预测、维修工单联动；目标为重视停机成本的企业。"
  }
};
let TEMPLATE = BOOT_TEMPLATE;

window.addEventListener('DOMContentLoaded', init);
function init() {
  // 从服务端取权威模板；失败用内置兜底
  fetch(`${BASE}/api/match/template`).then(r => r.json()).then(d => {
    if (d && d.company) { TEMPLATE = d; if (!$('companies').value) pref(); if (!$('product').value) $('product').value = JSON.stringify(d.product || BOOT_TEMPLATE.product, null, 1); }
  }).catch(() => {});
  if (!$('companies').value) pref();
  if (!$('product').value) $('product').value = JSON.stringify(BOOT_TEMPLATE.product, null, 1);
}
function pref() { $('companies').value = JSON.stringify([TEMPLATE.company || BOOT_TEMPLATE.company], null, 1); }
function resetToTemplate() {
  pref();
  $('product').value = JSON.stringify(TEMPLATE.product || BOOT_TEMPLATE.product, null, 1);
}
function addTemplateCompany() {
  let arr;
  try { arr = JSON.parse($('companies').value || '[]'); }
  catch (e) { showErr('当前企业 JSON 不合法，无法追加模板：' + e.message); return; }
  if (!Array.isArray(arr)) arr = [];
  arr.push(JSON.parse(JSON.stringify(TEMPLATE.company || BOOT_TEMPLATE.company)));
  $('companies').value = JSON.stringify(arr, null, 1);
  hideErr();
}

async function loadExample(lang) {
  hideErr();
  try {
    const r = await fetch(`${BASE}/api/match/example?lang=${lang}`);
    const d = await r.json();
    $('companies').value = JSON.stringify(d.companies, null, 1);
  } catch (e) { showErr(e); }
}
function ql(id, v) { $(id).value = v; }
function hideErr() { $('err').style.display = 'none'; }
function showErr(e) { const el = $('err'); el.textContent = '请求失败：' + e; el.style.display = 'block'; }

function scoreClass(s) {
  if (s === null || s === undefined) return 'sc-low';
  return s >= 2.5 ? 'sc-high' : (s >= 1.5 ? 'sc-mid' : 'sc-low');
}
function medalCls(i) { return i === 1 ? 'm1' : (i === 2 ? 'm2' : (i === 3 ? 'm3' : 'mn')); }

function hl(json) { return '<span class="jstr">' + json + '</span>'; }
function jh(obj) {
  if (obj === null) return '<span class="jnull">null</span>';
  const t = typeof obj;
  if (t === 'string') return '<span class="jstr">"' + obj + '"</span>';
  if (['number','boolean'].includes(t)) return '<span class="' + (t === 'number' ? 'jnum' : 'jboo') + '">' + obj + '</span>';
  if (Array.isArray(obj)) return '[' + obj.map(jh).join(', ') + ']';
  const keys = Object.keys(obj);
  return '{' + keys.map(k => '<span class="jkey">"' + k + '"</span>: ' + jh(obj[k])).join(', ') + '}';
}

async function runMatch() {
  hideErr();
  let companies, product;
  try { companies = JSON.parse($('companies').value || '[]'); }
  catch (e) { showErr('企业 JSON 解析失败：' + e.message); return; }
  try { const p = $('product').value.trim(); product = p ? JSON.parse(p) : null; }
  catch (e) { showErr('产品 JSON 解析失败：' + e.message); return; }
  if (!companies.length) { showErr('请先填充企业列表（可点“加载中文/英文示例”）'); return; }

  const qs = $('questions').value;
  const payload = { product, companies, questions: qs,
                    mode: $('mode').value,
                    apply_patch: $('patch').checked, backend: $('backend').value };
  const btn = $('runBtn'); btn.disabled = true;
  $('out').innerHTML = '<div class="card"><span class="spinner"></span>匹配中… 约 '
    + (payload.mode === 'topk' ? Math.min(500, companies.length) : companies.length)
    + ' 家 × ' + (qs === 'min' && payload.apply_patch ? 2 : {core:3, all:6, min:1}[qs])
    + ' 题（缓存可减少实际评估量）</div>';
  try {
    const r = await fetch(`${BASE}/api/match`, {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload),
    });
    const d = await r.json();
    if (!r.ok) { showErr(JSON.stringify(d)); $('out').innerHTML = ''; return; }
    render(d);
  } catch (e) { showErr(e); $('out').innerHTML = ''; }
  finally { btn.disabled = false; }
}

function advCls(a) {
  if (a.includes('🔥')) return 'adv-fire';
  if (a.includes('→')) return 'adv-ok';
  if (a.includes('◇')) return 'adv-wait';
  return 'adv-none';
}

function render(d) {
  const rows = d.ranking || [];
  const m = d.meta || {};
  let html = `<div class="card">
    <h3>② 排序结果
      <span class="tag">${rows.length} 家</span></h3>
    <div class="meta-line">
      <span>后端 <b>${m.backend || '-'}</b></span>
      <span>新评估题数 <b>${m.call_est ?? '-'}</b></span>
      <span>评分覆盖 <b>${m.candidate_count ?? '-'} / ${m.total_companies ?? '-'}</b></span>
      <span>缓存命中 <b>${m.cache_hits ?? 0}</b></span>
      <span>失败 <b>${m.failed_companies ?? 0}</b></span>
      <span>延迟 <b>${m.latency_ms ?? '-'} ms</b></span>
    </div>
    <table>
      <tr><th>#</th><th>企业</th><th>匹配分</th><th>百分</th><th>原始</th><th>置信</th><th>margin</th><th>语言</th><th>建议</th></tr>`;
  rows.forEach((r, i) => {
    const s = r.match_score, raw = r.score_raw, c = r.confidence;
    const badge = `<span class="badge ${r.lang === 'en' ? 'b-en' : 'b-zh'}">${r.lang === 'en' ? 'EN' : 'ZH'}</span>`;
    const adv = r.advice || '';
    const patch = r.patched ? `<span class="patched" title="${r.patch_note || ''}">↩${(r.patch_note||'').split('→')[1]||'校正'}</span>` : '';
    html += `<tr>
      <td><span class="medal ${medalCls(i+1)}">${i+1}</span></td>
      <td><b>${r.name || '?'}</b> ${badge}</td>
      <td class="scorecell ${scoreClass(s)}">${s == null ? '—' : s.toFixed(2)} ${patch}</td>
      <td>${r.score_pct == null ? '—' : r.score_pct + '%'}</td>
      <td class="scorecell">${raw == null ? '—' : raw.toFixed(2)}</td>
      <td>${c == null ? '—' : c.toFixed(2)}</td>
      <td>${(r.margin ?? 0).toFixed(3)}</td>
      <td>${badge}</td>
      <td><span class="badge ${advCls(adv)}">${adv || '—'}</span></td>
    </tr>
    <tr><td colspan="8"><details><summary>▸ ${r.name} — 六维明细 ${r.patch_note ? '（' + r.patch_note + '）' : ''}</summary>
      <pre>${jh(r.per_question || {})}</pre></details></td></tr>`;
  });
  html += `</table></div>
    <div class="card section-gap"><h3>③ 原始 JSON 响应 <span class="tag">可复制集成</span></h3>
      <pre>${jh(d)}</pre></div>`;
  $('out').innerHTML = html;
}
</script>
</body>
</html>
