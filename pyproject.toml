[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jevp"
version = "0.1.0"
description = "JevP: System One decision engine (Jev-like) on stock small LLMs via constrained decoding"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "torch>=2.0",
    "transformers>=4.40",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Apple Silicon 上的默认推理后端（Mac mini 4 基线）
mlx = ["mlx-lm>=0.16"]

[tool.setuptools.packages.find]
include = ["jevp*"]